
- name: disable default nginx 
  command: dnf module disable nginx -y

- name: enable nginx:1.26
  command: dnf module enable nginx:1.26 -y

- name: Install nginx 
  dnf:
    name:
      - nginx
    state: present

- name: statrt and enable nginx 
  service:
    name: nginx
    state: started
    enabled: yes

- name: Find all files and subdirectories inside the directory
  ansible.builtin.find:
    paths: /usr/share/nginx/html/
    file_type: any
    hidden: true
  register: directory_contents

- name: print directory contents 
  debug:
    msg: "{{ directory_contents }}"

- name: Remove all found contents
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ directory_contents.files }}"

- name: Download frontend application
  get_url:
    url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/frontend-v4.zip
    dest: /tmp/frontend.zip

- name: Unzip frontend
  unarchive:
    src: /tmp/frontend.zip
    dest: /usr/share/nginx/html/
    remote_src: yes

- name: copy roboshop conf 
  template:
    src: roboshop.conf.j2
    dest: /etc/nginx/default.d/roboshop.conf
  notify: restart nginx  


